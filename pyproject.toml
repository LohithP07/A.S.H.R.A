[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ashra"
version = "0.5.0"
description = "A.S.H.R.A - a local-first, note-grounded personal assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "A.S.H.R.A Project" }]
keywords = ["assistant", "notes", "knowledge-graph", "llm", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "mcp>=1.0"]

[project.scripts]
ashra-server = "server:main"
ashra-mcp-filesystem = "ashra.mcp_server:main"

[tool.setuptools]
packages = ["ashra", "ashra.agents", "ashra.integrations"]
py-modules = ["build", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
