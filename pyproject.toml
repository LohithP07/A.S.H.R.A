[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ashra"
version = "0.1.0"
description = "A.S.H.R.A - a local-first, note-grounded personal assistant"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "A.S.H.R.A Project" }]
keywords = ["assistant", "notes", "knowledge-graph", "llm", "local-first"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["ashra"]
py-modules = ["build", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
