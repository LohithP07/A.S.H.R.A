<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.S.H.R.A — Knowledge Galaxy</title>
<meta name="description" content="A.S.H.R.A, a private, note-grounded knowledge assistant with an interactive 3D map of your notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>
<body>

<div id="stage" aria-hidden="true"></div>
<div class="vignette"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">✦</div>
    <div class="brand-text">
      <p class="eyebrow">A.S.H.R.A · Private Knowledge Assistant</p>
      <h1>Knowledge <em>Galaxy</em></h1>
    </div>
  </div>

  <div class="top-actions">
    <div class="stats" aria-label="Graph statistics">
      <div class="stat"><strong id="stat-notes">25</strong><span>notes</span></div>
      <div class="stat"><strong id="stat-links">94</strong><span>links</span></div>
    </div>
    <a class="ghost-btn" href="brain.html">Brain</a>
    <button class="ghost-btn active" id="toggle-labels" type="button" aria-pressed="true">Labels on</button>
    <button class="ghost-btn" id="reset-view" type="button">Reset view</button>
  </div>
</header>

<aside class="legend" aria-label="Note groups">
  <p class="legend-title">Constellations</p>
  <div id="legend-list"></div>
</aside>

<section class="chat-dock" id="chat-dock" aria-label="Ask your notes">
  <article class="chat-card" id="chat-card" hidden>
    <p class="chat-answer" id="chat-answer"></p>
    <p class="chat-sources" id="chat-sources"></p>
    <div class="chat-approval" id="chat-approval" hidden>
      <p class="chat-approval-text" id="chat-approval-text"></p>
      <div class="chat-approval-actions">
        <button class="approval-btn approve" id="chat-approve" type="button">Approve</button>
        <button class="approval-btn deny" id="chat-deny" type="button">Deny</button>
      </div>
    </div>
  </article>
  <form class="chat-form" id="chat-form" autocomplete="off">
    <span class="chat-orb" aria-hidden="true"></span>
    <label class="sr-only" for="chat-input">Ask your notes</label>
    <input class="chat-input" id="chat-input" type="text" maxlength="4000" placeholder="Ask A.S.H.R.A, or say “remember that …”" required>
    <button class="chat-mic" id="chat-mic" type="button" aria-label="Ask by voice" aria-pressed="false" title="Ask by voice (Chrome/Edge)">🎙</button>
    <button class="chat-send" id="chat-send" type="submit">Ask</button>
  </form>
  <p class="chat-status" id="chat-status" aria-live="polite">Ask A.S.H.R.A · Say “remember that …” · Click a star</p>
</section>

<aside class="panel" id="panel" aria-hidden="true" aria-label="Note details">
  <button class="panel-close" id="panel-close" type="button" aria-label="Close note panel">×</button>
  <div class="panel-scroll" id="panel-scroll">
    <p class="panel-kicker"><span class="panel-dot" id="panel-dot"></span><span id="panel-group"></span></p>
    <h2 class="panel-title" id="panel-title"></h2>
    <p class="panel-path" id="panel-path"></p>
    <div class="panel-rule"></div>
    <p class="panel-excerpt" id="panel-excerpt"></p>
    <section class="connections" aria-labelledby="connections-heading">
      <div class="connections-head">
        <h3 id="connections-heading">Connected notes</h3>
        <span id="panel-degree"></span>
      </div>
      <ul class="connection-list" id="panel-links"></ul>
    </section>
  </div>
  <div class="panel-glow" aria-hidden="true"></div>
</aside>

<div class="loader" id="loader">
  <div class="loader-orbit" aria-hidden="true">
    <span class="orbit-dot"></span>
    <span class="orbit-core"></span>
  </div>
  <p class="loader-title">A.S.H.R.A</p>
  <p class="loader-sub" id="loader-sub">Mapping your notes into a knowledge galaxy</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.73.4/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script src="app.js"></script>
</body>
</html>
